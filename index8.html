<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Encuesta de anime</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="encuesta">

        <h1>Encuesta de cyclo45</h1>

        <p class="pregunta">
            ¿Cuál de estos juegos te gusta mas?
        </p>

        <div class="opcion">
            <input type="checkbox" id="metal slug">
            <label for="metal slug">Metal Slug</label>
        </div>

        <div class="opcion">
            <input type="checkbox" id="cyberpunk2077">
            <label for="cyberpunk2077">Cyberpunk 2077</label>
        </div>

        <button id="btn-revisar">Revisar respuesta</button>

        <button id="btn-enviar" disabled>Enviar encuesta</button>

        <p id="resultado"></p>

     <script src="script8.js"></script>
    </div>
</body>

</html>
